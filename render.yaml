# Render "Blueprint": provisions the whole app in one go.
# In the Render dashboard: New + > Blueprint > connect this repo. Render reads
# this file and creates the web app, the background worker, a Postgres database
# (with automatic daily backups), and a Redis/Key-Value store.
#
# After the first deploy, set the values marked `sync: false` under
# Environment for BOTH the web and worker service (see docs/PILOT_RUNBOOK.md):
#   APP_BASE_URL, PII_ENCRYPTION_KEY, and (optional) the SMTP_* + GOOGLE_CLIENT_ID.
#
# If anything in this file is rejected by a future Render schema change, just
# follow the click-by-click UI steps in docs/PILOT_RUNBOOK.md instead.

databases:
  - name: timetable-db
    plan: basic-256mb          # smallest paid tier; includes automated backups

services:
  # Shared Redis: rate-limit store + background job queue.
  - type: keyvalue
    name: timetable-redis
    plan: starter
    ipAllowList: []            # internal-only; not reachable from the internet

  # Secrets shared by BOTH the web and worker so their tokens match.
  - type: web
    name: timetable-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health/live
    preDeployCommand: flask db upgrade    # apply DB migrations before each deploy
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: timetable-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: timetable-redis
          type: keyvalue
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          name: timetable-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true     # Render generates a strong random secret
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_RETENTION_YEARS
        value: "7"
      # Set these yourself in the dashboard after first deploy:
      - key: APP_BASE_URL
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  # Background worker: runs timetable generation off the web request.
  - type: worker
    name: timetable-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python worker.py
    plan: starter
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: timetable-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: timetable-redis
          type: keyvalue
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          name: timetable-redis
          type: keyvalue
          property: connectionString
      # IMPORTANT: copy the SAME values the web service generated for these two.
      - key: JWT_SECRET_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false

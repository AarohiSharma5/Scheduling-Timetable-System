# FREE deploy: ONE web service + a free PostgreSQL. No Redis and no separate
# worker — timetable generation runs inline (the app has a built-in synchronous
# fallback) and rate-limiting falls back to in-memory. Great for testing 1-2
# schools at zero cost.
#
# In the Render dashboard: New +  >  Blueprint  >  pick this repo  >  Apply.
#
# FREE-TIER CAVEATS (important):
#   * The web service SLEEPS after ~15 min of no traffic; the next visit takes
#     ~30-60s to wake up. Just wait and refresh — it's not broken.
#   * The free database is small and is NOT meant for permanent data. Before a
#     real school relies on this, switch to render-paid.yaml (rename it to
#     render.yaml) so you get an always-on service + backed-up database.
#
# After the first deploy, set the `sync: false` values under the web service's
# Environment tab (see docs/PILOT_RUNBOOK.md):
#   APP_BASE_URL (your Render URL), and optionally PII_ENCRYPTION_KEY, the SMTP_*
#   email settings, and GOOGLE_CLIENT_ID.

databases:
  - name: timetable-db
    plan: free

services:
  - type: web
    name: timetable-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health/live
    # Migrations + server start are handled by the image's entrypoint.sh, so no
    # custom command is needed here.
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: timetable-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true     # Render generates a strong random secret
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_RETENTION_YEARS
        value: "7"
      # Set these yourself in the dashboard after the first deploy:
      - key: APP_BASE_URL
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

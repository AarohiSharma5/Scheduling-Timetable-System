# FREE deploy: ONE web service on Render + an EXTERNAL free PostgreSQL (Neon or
# Supabase). No Redis and no separate worker — timetable generation runs inline
# (the app has a built-in synchronous fallback) and rate-limiting falls back to
# in-memory. Great for testing 1-2 schools at zero cost.
#
# Why an external DB? Render's own FREE database is DELETED after ~30 days
# (taking all your data with it). Neon/Supabase free tiers are persistent, so we
# point DATABASE_URL at one of those instead. Set it under the web service's
# Environment tab (sync: false below).
#
# In the Render dashboard: New +  >  Blueprint  >  pick this repo  >  Apply.
#
# FREE-TIER CAVEAT: the web service SLEEPS after ~15 min of no traffic; the next
# visit takes ~30-60s to wake up. Just wait and refresh — it's not broken.
#
# After the first deploy, set the `sync: false` values under the web service's
# Environment tab (see docs/PILOT_RUNBOOK.md):
#   DATABASE_URL (your Neon/Supabase connection string), APP_BASE_URL (your
#   Render URL), and optionally PII_ENCRYPTION_KEY, the SMTP_* email settings,
#   and GOOGLE_CLIENT_ID.

services:
  - type: web
    name: timetable-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health/live
    # Migrations + server start are handled by the image's entrypoint.sh, so no
    # custom command is needed here.
    envVars:
      - key: FLASK_ENV
        value: production
      # Set this in the dashboard to your Neon/Supabase connection string
      # (postgresql://...  — include ?sslmode=require).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true     # Render generates a strong random secret
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_RETENTION_YEARS
        value: "7"
      # Set these yourself in the dashboard after the first deploy:
      - key: APP_BASE_URL
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
